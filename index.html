<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My 3DS Website</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #ff6600;
    }
    p {
      color: #333333;
      font-size: 16px;
    }
    a {
      color: #0066ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .box {
      background-color: #ffffff;
      border: 2px solid #ff6600;
      padding: 15px;
      margin: 20px auto;
      max-width: 300px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Welcome to My 3DS Site!</h1>
  
  <div class="box">
    <p>Hello! This is my first website that works on a 3DS browser.</p>
    <p>Check out my links:</p>
    <ul>
      <li><a href="https://example.com" target="_blank">Example Link 1</a></li>
      <li><a href="https://example.com" target="_blank">Example Link 2</a></li>
    </ul>
  </div>
  
  <p>Enjoy browsing on your 3DS!</p>
</body>
</html>
